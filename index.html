<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamspeak - Multi-Language App</title>
    <!-- Tailwind CSS for modern fluid styling layouts -->
    <script src="https://jsdelivr.net"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }
        .float-anim { animation: float 4s ease-in-out infinite; }
        .shake-anim { animation: shake 0.35s ease-in-out; }
        .pop-anim { animation: pop 0.25s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 font-sans min-h-screen flex flex-col justify-between selection:bg-purple-200">

    <!-- Top Navigation Premium Glassmorphism Navbar Container -->
    <header id="app-header" class="bg-white/80 backdrop-blur-md border-b-4 border-purple-200 p-4 sticky top-0 z-50 hidden shadow-sm">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <button onclick="showScreen('welcome')" class="bg-gray-100 hover:bg-gray-200 text-gray-500 hover:text-gray-700 h-10 w-10 flex items-center justify-center font-bold rounded-2xl border-2 border-gray-200 transition-all">
                ✕
            </button>
            
            <!-- Dynamic Easing Progress Indicator Bar Component Wrapper -->
            <div id="progress-container" class="w-1/3 h-5 bg-purple-100 rounded-full overflow-hidden mx-2 border-2 border-purple-200 p-0.5">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-400 to-green-500 rounded-full transition-all duration-500 shadow-sm" style="width: 10%"></div>
            </div>

            <!-- Stats Analytics Dashboard Panel Component Matrix -->
            <div class="flex items-center space-x-2 font-black text-sm">
                <span id="streak-disp" class="bg-orange-50 border-2 border-orange-200 text-orange-600 px-2.5 py-1.5 rounded-2xl flex items-center shadow-xs">🔥 <span id="streak-val" class="ml-1">1</span></span>
                <span id="xp-disp" class="bg-blue-50 border-2 border-blue-200 text-blue-600 px-2.5 py-1.5 rounded-2xl flex items-center shadow-xs">✨ <span id="xp-val" class="ml-1">0</span></span>
                <button onclick="showScreen('shop')" class="bg-fuchsia-50 hover:bg-fuchsia-100 text-fuchsia-600 px-2.5 py-1.5 rounded-2xl border-2 border-fuchsia-200 flex items-center transition-all shadow-xs cursor-pointer">💎 <span id="gem-val" class="ml-1">50</span></button>
                <button onclick="showScreen('leaderboard')" class="bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 text-amber-700 h-9 w-9 flex items-center justify-center rounded-2xl transition-all shadow-xs cursor-pointer">🏆</button>
            </div>
        </div>
    </header>

    <!-- Main Content App Window Frame -->
    <main class="flex-grow p-4 flex flex-col justify-center items-center max-w-md mx-auto w-full">
        
        <!-- SCREEN 0: MULTI-LANGUAGE TRACK SELECTION OVERLAY HUB -->
        <section id="welcome-screen" class="w-full space-y-6 text-center">
            <div class="space-y-3">
                <div class="text-7xl float-anim drop-shadow-md">🐑</div>
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-violet-600 via-purple-600 to-pink-600 tracking-tight">Dreamspeak</h1>
                <p class="text-purple-500 font-bold bg-purple-100/60 inline-block px-4 py-1.5 rounded-full border border-purple-200/50">Pick a language to study with wooly sheep!</p>
            </div>

            <div class="grid grid-cols-1 gap-4 mt-6">
                <!-- Track 1: Spanish -->
                <button onclick="openTierSelector('spanish')" class="w-full p-5 bg-white border-b-4 border-r-2 border-gray-200 rounded-3xl flex items-center justify-between hover:border-blue-400 hover:bg-blue-50/40 shadow-sm transition-all group active:scale-98">
                    <div class="flex items-center space-x-4">
                        <span class="text-4xl filter drop-shadow-xs">🇪🇸</span>
                        <div class="text-left">
                            <span class="text-xl font-black text-gray-800 group-hover:text-blue-600 block">Spanish Course</span>
                            <span class="text-xs text-gray-400 font-bold uppercase tracking-wider">Español Tracks</span>
                        </div>
                    </div>
                    <span class="text-blue-500 font-black opacity-0 group-hover:opacity-100 transition-opacity">Learn ➔</span>
                </button>

                <!-- Track 2: French -->
                <button onclick="openTierSelector('french')" class="w-full p-5 bg-white border-b-4 border-r-2 border-gray-200 rounded-3xl flex items-center justify-between hover:border-indigo-400 hover:bg-indigo-50/40 shadow-sm transition-all group active:scale-98">
                    <div class="flex items-center space-x-4">
                        <span class="text-4xl filter drop-shadow-xs">🇫🇷</span>
                        <div class="text-left">
                            <span class="text-xl font-black text-gray-800 group-hover:text-indigo-600 block">French Course</span>
                            <span class="text-xs text-gray-400 font-bold uppercase tracking-wider">Français Tracks</span>
                        </div>
                    </div>
                    <span class="text-indigo-500 font-black opacity-0 group-hover:opacity-100 transition-opacity">Learn ➔</span>
                </button>

                <!-- Track 3: Japanese -->
                <button onclick="openTierSelector('japanese')" class="w-full p-5 bg-white border-b-4 border-r-2 border-gray-200 rounded-3xl flex items-center justify-between hover:border-rose-400 hover:bg-rose-50/40 shadow-sm transition-all group active:scale-98">
                    <div class="flex items-center space-x-4">
                        <span class="text-4xl filter drop-shadow-xs">🇯🇵</span>
                        <div class="text-left">
                            <span class="text-xl font-black text-gray-800 group-hover:text-rose-600 block">Japanese Course</span>
                            <span class="text-xs text-gray-400 font-bold uppercase tracking-wider">日本語 Tracks</span>
                        </div>
                    </div>
                    <span class="text-rose-500 font-black opacity-0 group-hover:opacity-100 transition-opacity">Learn ➔</span>
                </button>

                <!-- Track 4: Thai -->
                <button onclick="openTierSelector('thai')" class="w-full p-5 bg-white border-b-4 border-r-2 border-gray-200 rounded-3xl flex items-center justify-between hover:border-emerald-400 hover:bg-emerald-50/40 shadow-sm transition-all group active:scale-98">
                    <div class="flex items-center space-x-4">
                        <span class="text-4xl filter drop-shadow-xs">🇹🇭</span>
                        <div class="text-left">
                            <span class="text-xl font-black text-gray-800 group-hover:text-emerald-600 block">Thai Course</span>
                            <span class="text-xs text-gray-400 font-bold uppercase tracking-wider">ภาษาไทย Tracks</span>
                        </div>
                    </div>
                    <span class="text-emerald-500 font-black opacity-0 group-hover:opacity-100 transition-opacity">Learn ➔</span>
                </button>
            </div>
        </section>

        <!-- SCREEN 0.5: LEVEL / IN-DEPTH TIER LEVEL CHOOSE PANEL -->
        <section id="tier-screen" class="w-full hidden space-y-6">
            <div class="text-center space-y-2">
                <span id="tier-flag-header" class="text-5xl block">🇪🇸</span>
                <h2 class="text-3xl font-black text-gray-800">Select Lesson Depth</h2>
                <p class="text-gray-400 font-bold uppercase text-xs tracking-widest">From basics to professional fluency</p>
            </div>

            <div class="space-y-4">
                <button onclick="selectLanguageAndTier('beginner')" class="w-full p-5 bg-gradient-to-r from-emerald-400 to-green-500 text-white rounded-3xl text-left border-b-4 border-green-600 shadow-md active:scale-98 transition-all">
                    <h3 class="text-xl font-black">🌱 Beginner Level</h3>
                    <p class="text-xs text-emerald-100 font-medium mt-1">Core alphabet, greetings, numbers, and basic items.</p>
                </button>
                <button onclick="selectLanguageAndTier('intermediate')" class="w-full p-5 bg-gradient-to-r from-cyan-400 to-blue-500 text-white rounded-3xl text-left border-b-4 border-blue-600 shadow-md active:scale-98 transition-all">
                    <h3 class="text-xl font-black">🚀 Intermediate Level</h3>
                    <p class="text-xs text-blue-100 font-medium mt-1">Past tense conversation, travel, dining out, and shopping syntax.</p>
                </button>
                <button onclick="selectLanguageAndTier('fluent')" class="w-full p-5 bg-gradient-to-r from-purple-500 to-pink-500 text-white rounded-3xl text-left border-b-4 border-purple-700 shadow-md active:scale-98 transition-all">
                    <h3 class="text-xl font-black">🎓 Fluent (Advanced)</h3>
