<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreamspeak - Smart Multi-Language Platform</title>
    <!-- Stable Tailwind CSS Engine Configuration -->
    <script src="https://tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1.5deg); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .float-anim { animation: float 4s ease-in-out infinite; }
        .shake-anim { animation: shake 0.35s ease-in-out; }
        .pop-anim { animation: pop 0.25s ease-in-out; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-100 via-purple-50 to-pink-100 font-sans min-h-screen flex flex-col justify-between select-none">

    <!-- Top Navigation Dashboard Status Panel Header -->
    <header id="app-header" class="bg-white/90 backdrop-blur-md border-b-4 border-purple-200 p-4 sticky top-0 z-50 hidden shadow-sm">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <button onclick="showScreen('welcome')" class="bg-gray-100 hover:bg-gray-200 text-gray-500 h-10 w-10 flex items-center justify-center font-black rounded-2xl border-2 border-gray-200 transition-all cursor-pointer">
                ✕
            </button>
            
            <!-- Progress Completion Bar Tracking Segment -->
            <div id="progress-container" class="w-1/3 h-5 bg-purple-100 rounded-full overflow-hidden mx-2 border-2 border-purple-200 p-0.5">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-emerald-400 to-green-500 rounded-full transition-all duration-500 shadow-sm" style="width: 10%"></div>
            </div>

            <!-- Dashboard Statistics Arrays Displays Components -->
            <div class="flex items-center space-x-2 font-black text-xs">
                <span class="bg-orange-50 border-2 border-orange-200 text-orange-600 px-2.5 py-1.5 rounded-2xl flex items-center">🔥 <span id="streak-val">1</span></span>
                <span class="bg-blue-50 border-2 border-blue-200 text-blue-600 px-2.5 py-1.5 rounded-2xl flex items-center">✨ <span id="xp-val">0</span></span>
                <button onclick="showScreen('shop')" class="bg-fuchsia-50 hover:bg-fuchsia-100 text-fuchsia-600 px-2 py-1.5 rounded-2xl border-2 border-fuchsia-200 flex items-center transition-all cursor-pointer shadow-xs">💎 <span id="gem-val">50</span></button>
                <button onclick="showScreen('leaderboard')" class="bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 text-amber-700 h-8 w-8 flex items-center justify-center rounded-2xl transition-all cursor-pointer">🏆</button>
            </div>
        </div>
    </header>

    <!-- App Display Window Context Viewport -->
    <main class="flex-grow p-4 flex flex-col justify-center items-center max-w-md mx-auto w-full">
        
        <!-- SCREEN 1: WELCOME MULTI-LANGUAGE TRACK HUBS -->
        <section id="welcome-screen" class="w-full space-y-6 text-center">
            <div class="space-y-2">
                <div class="text-7xl float-anim drop-shadow-md">🐑</div>
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 tracking-tight">Dreamspeak</h1>
                <p class="text-purple-600 font-bold bg-purple-100/60 inline-block px-4 py-1.5 rounded-full border border-purple-200/50">Pick a language to start with your wooly sheep!</p>
            </div>

            <div class="grid grid-cols-1 gap-4 pt-2">
                <button onclick="startQuestionnaire('spanish')" class="w-full p-5 bg-white border-b-4 border-r-2 border-gray-200 rounded-3xl flex items-center justify-between hover:border-blue-400 hover:bg-blue-50/30 shadow-sm transition-all group active:scale-98 cursor-pointer">
                    <div class="flex items-center space-x-4">
                        <span class="text-4xl">🇪🇸</span>
                        <div class="text-left"><span class="text-xl font-black text-gray-800 block">Spanish Course</span><span class="text-xs text-gray-400 font-bold uppercase tracking-wider">Español</span></div>
                    </div>
                    <span class="text-blue-500 font-black text-sm">Learn ➔</span>
                </button>

                <button onclick="startQuestionnaire('french')" class="w-full p-5 bg-white border-b-4 border-r-2 border-gray-200 rounded-3xl flex items-center justify-between hover:border-indigo-400 hover:bg-indigo-50/30 shadow-sm transition-all group active:scale-98 cursor-pointer">
                    <div class="flex items-center space-x-4">
                        <span class="text-4xl">🇫🇷</span>
                        <div class="text-left"><span class="text-xl font-black text-gray-800 block">French Course</span><span class="text-xs text-gray-400 font-bold uppercase tracking-wider">Français</span></div>
                    </div>
                    <span class="text-indigo-500 font-black text-sm">Learn ➔</span>
                </button>

                <button onclick="startQuestionnaire('japanese')" class="w-full p-5 bg-white border-b-4 border-r-2 border-gray-200 rounded-3xl flex items-center justify-between hover:border-rose-400 hover:bg-rose-50/30 shadow-sm transition-all group active:scale-98 cursor-pointer">
                    <div class="flex items-center space-x-4">
                        <span class="text-4xl">🇯🇵</span>
                        <div class="text-left"><span class="text-xl font-black text-gray-800 block">Japanese Course</span><span class="text-xs text-gray-400 font-bold uppercase tracking-wider">日本語</span></div>
                    </div>
                    <span class="text-rose-500 font-black text-sm">Learn ➔</span>
                </button>

                <button onclick="startQuestionnaire('thai')" class="w-full p-5 bg-white border-b-4 border-r-2 border-gray-200 rounded-3xl flex items-center justify-between hover:border-emerald-400 hover:bg-emerald-50/30 shadow-sm transition-all group active:scale-98 cursor-pointer">
                    <div class="flex items-center space-x-4">
                        <span class="text-4xl">🇹🇭</span>
                        <div class="text-left"><span class="text-xl font-black text-gray-800 block">Thai Course</span><span class="text-xs text-gray-400 font-bold uppercase tracking-wider">ภาษาไทย</span></div>
                    </div>
                    <span class="text-emerald-500 font-black text-sm">Learn ➔</span>
                </button>
            </div>
        </section>

        <!-- SCREEN 2: THE INTERACTIVE PLACEMENT QUESTIONNAIRE PANEL -->
        <section id="survey-screen" class="w-full hidden space-y-6">
            <div class="flex flex-col items-center space-y-2">
                <div class="text-6xl float-anim">🐑</div>
                <div class="bg-white border-2 border-purple-200 rounded-2xl p-3 text-center text-sm font-bold text-purple-900 shadow-sm">
                    Let's find your perfect lesson path!
                </div>
            </div>

            <div class="bg-white border-4 border-purple-200 rounded-3xl p-6 shadow-md space-y-4">
                <div class="flex justify-between items-center text-xs font-black uppercase text-purple-400">
                    <span id="survey-title">Placement Test</span>
                    <span id="survey-step-counter">Question 1 of 3</span>
                </div>
                
                <h2 id="survey-prompt" class="text-2xl font-black text-gray-800 leading-snug">How much do you already know?</h2>
                
                <div id="survey-choices" class="grid grid-cols-1 gap-3 pt-2">
                    <!-- Option node elements injected via script arrays -->
                </div>
            </div>
        </section>

        <!-- SCREEN 3: LESSON QUIZ MODULE INTERFACE -->
        <section id="quiz-screen" class="w-full hidden space-y-6">
            <div class="flex flex-col items-center justify-center space-y-2">
                <div id="char-avatar" class="text-7xl float-anim transition-all duration-300">🐑</div>
                <div id="char-bubble" class="bg-white border-3 border-purple-200 rounded-2xl p-4 text-center text-purple-950 font-bold text-sm shadow-md">
                    Translate this phrase for me!
                </div>
            </div>

            <div id="quiz-card" class="bg-white border-4 border-purple-200 rounded-3xl p-6 shadow-md transition-all">
                <div class="mb-3">
                    <span id="tier-badge" class="bg-purple-100 text-purple-700 px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider border border-purple-200">Beginner</span>
                </div>
                <h1 id="question-text" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-6">...</h1>
                
                <div id="choices-grid" class="grid grid-cols-1 gap-3">
                    <!-- Core quiz choices button groups -->
                </div>
            </div>
        </section>

        <!-- SCREEN 4: STOREFRONT -->
        <section id="shop-screen" class="w-full hidden space-y-4">
            <div class="flex justify-between items-center border-b-2 border-purple-100 pb-3">
                <h2 class="text-2xl font-black text-purple-700">💎 Points Shop</h2>
